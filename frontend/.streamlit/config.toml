# FastPilot theme — ratified design tokens (round-2 review), BOTH themes.
# Streamlit >=1.46 supports [theme.light] / [theme.dark]; the app follows the
# viewer's OS/browser appearance. There is no in-app theme switch (founder, 24 Nov
# 2026: "Follow the system only (Recommended)"): an in-app toggle could not switch
# Streamlit's own widgets, so it left half the UI in the other theme.
# Native widgets (chat, buttons, radio, toggle, sidebar, code) are themed HERE; our
# custom elements (chips, badges, citations, sources, terminal) carry matching
# light/dark values in the injected CSS layer (frontend/styles.py), switched by the
# same prefers-color-scheme rule. Contrast is measured in tests/test_theme.py.

[theme]
font = "sans-serif"

# primaryColor uses the accessible #0F766E so filled-button text passes 4.5:1
# (white-on-#0D9488 was 3.0:1 — round-2 contrast fix). The brand #0D9488 lives in
# the CSS layer for glyphs/borders/citations (3:1 graphic floor).
[theme.light]
primaryColor = "#0F766E"
backgroundColor = "#FAFAF9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C1917"
# Inline and block code: brand teal on a visible stone panel (4.72:1); without these
# Streamlit falls back to green code text and a panel the page colour hides.
codeTextColor = "#0F766E"
codeBackgroundColor = "#F0EEEA"
linkColor = "#0F766E"
borderColor = "#E7E5E4"

[theme.dark]
primaryColor = "#2DD4BF"
backgroundColor = "#0C1222"
secondaryBackgroundColor = "#151D30"
textColor = "#E7E9EE"
codeTextColor = "#5EEAD4"
codeBackgroundColor = "#18213A"
linkColor = "#5EEAD4"
borderColor = "#28324A"

[server]
headless = true
# Serve frontend/static/ at /app/static/: the self-hosted font files (#65), so visitors'
# browsers no longer contact Google Fonts.
enableStaticServing = true

# Visitors' browsers send nothing to Streamlit: its anonymous usage statistics are on by
# default (founder, 25 Nov 2026: "Turn it off (Recommended)"; #61). The privacy note
# mentions only Opik, which stays true with this off.
[browser]
gatherUsageStats = false
