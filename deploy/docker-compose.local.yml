# Mac only, for measuring (infra Phase 22a). Never deployed: the allow-list refuses published ports.
#   docker network create caddy_net   # once; production's frontend expects it
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.local.yml up -d --build
# Builds the images from this checkout instead of pulling a sha- tag, and publishes the backend and
# frontend on 127.0.0.1 only. Qdrant and Redis sit only on the internal fp_data network, where Docker
# publishes no ports: restore the index from inside (DEPLOY.md, "Production on the VPS").
services:
  runner:
    image: fastpilot-runner:local
    build: {context: .., dockerfile: runner/Dockerfile}
  backend:
    image: fastpilot-backend:local
    build: {context: ../app, dockerfile: Dockerfile}
    ports: ["127.0.0.1:8000:8000"]
  frontend:
    image: fastpilot-frontend:local
    build: {context: ../frontend, dockerfile: Dockerfile}
    ports: ["127.0.0.1:8501:8501"]
