# Public uptime check for the live site (founder, 25 Nov 2026: "Move it to fastpilot
# (Recommended)"). It runs here, not in the private infra repository, because Actions
# minutes are free for public repositories; in infra a 15-minute check used about 2,900 of
# the organisation's 3,000 shared private minutes a month. Replaces infra's "Staging uptime".
#
# Failure emails go to the account that first added this file to main, then to whoever last
# changes the `cron` line or re-enables the workflow: keep that the founder's account.
# See wiki/uptime-check.md.
name: Uptime

on:
  schedule:
    # Off the hour: GitHub delays, and may drop, scheduled runs at the start of each hour.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      domain:
        description: Public domain to check.
        required: true
        default: fastpilot.olaheavy.dev

permissions: {}

# One group per trigger, never cancelled: a manual check of another host must not cancel a
# scheduled production check (runs take seconds, so they cannot pile up).
concurrency:
  group: uptime-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  public-uptime:
    name: Public uptime
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      DOMAIN: ${{ inputs.domain || 'fastpilot.olaheavy.dev' }}
    steps:
      - name: Check public HTTPS
        run: |
          set -euo pipefail
          if [[ ! "$DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "Domain must be a bare host name, for example fastpilot.olaheavy.dev (got: $DOMAIN)." >&2
            exit 1
          fi
          # Two retries so one network blip does not send a failure email; no -L, so a
          # redirect fails. no-cache keeps Cloudflare from answering for a down origin.
          status="$(curl -sS -o /tmp/home.html -w '%{http_code}' --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            -H 'Cache-Control: no-cache' -A 'fastpilot-uptime' "https://${DOMAIN}")"
          if [ "$status" != "200" ]; then
            echo "https://${DOMAIN} returned HTTP $status, expected 200." >&2
            exit 1
          fi
          if [ ! -s /tmp/home.html ]; then
            echo "https://${DOMAIN} returned an empty page." >&2
            exit 1
          fi
          echo "ok: https://${DOMAIN} returned HTTP 200"
