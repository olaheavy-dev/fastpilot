name: CI

# Hermetic lint + unit tests for FastPilot. CI installs exactly what uv.lock pins (`uv sync --locked`
# fails when the lock is out of step with pyproject.toml) and never re-locks (`uv run --frozen`), so it
# tests the versions the Docker images install through constraints.txt. Integration (Redis) and live
# (real keys) tests are excluded by default; the 90% coverage gate is a regression guard over app/ and runner/.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Install exactly what uv.lock pins (issue #25): CI tests the versions local work and the
      # Docker images use. uv itself is pinned so the lock format can't drift under CI.
      - name: Install uv and the locked dependencies
        run: |
          pip install uv==0.13.7
          uv sync --locked --all-extras --python 3.12  # 3.12 like the python:3.12-slim images
      # Lint first: catches the common failures in seconds.
      - name: Ruff
        run: uv run --frozen ruff check .
      # The images install with -c constraints.txt; fail if those files drift from uv.lock.
      - name: Image constraints match uv.lock
        run: scripts/export_constraints.sh --check
      - name: Unit tests (hermetic — integration/live/visual excluded by default)
        run: uv run --frozen pytest --cov=app --cov=runner --cov-report=term-missing --cov-fail-under=90

  # Mirror the in-repo wiki/ to the GitHub Wiki after tests pass. Push-to-main only
  # (PRs — incl. forks — can't get a write token), and only if tests are green.
  # publish_wiki.py is pure stdlib (no deps) and idempotent: it no-ops when unchanged.
  publish-wiki:
    needs: lint-and-unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to push to the repo's .wiki.git
    steps:
      - uses: actions/checkout@v7
      - name: Configure git auth for the wiki push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The script clones .wiki.git into a temp dir, so the checkout's repo-local
          # credentials don't apply — inject the token globally for github.com.
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish wiki
        run: python scripts/publish_wiki.py
